          url: /documentation/#labtracsupport
        - title: Installing Labtrac
          url: /documentation/#install

    - title: What's New in Labtrac?
      url: /documentation/new-features.html
      icon: sparkles
      description: The new features in the latest version of Labtrac.

    - title: Setup
      url: /documentation/setup.html
