# Documentation navigation.
#
# This one file drives the sidebar, breadcrumbs, previous/next links,
# the topic cards on the welcome page and which pages appear in search.
# To add a page: create the .md file in /documentation, then list it here.
#
#   title       — label shown in the menu
#   url         — the page's address (the .md file name with .html)
#   icon        — one of the icons in _includes/icon.html
#   description — one line used on the welcome page cards and for search engines
#   children    — optional links to sections within the page (#anchor names)

- group: Getting started
  items:
    - title: Welcome
      url: /documentation/
      icon: home
      description: How to contact Labtrac Support and get Labtrac installed.
      children:
